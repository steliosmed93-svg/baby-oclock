  if(!USER)return `<h1>Σύντροφος</h1><div class="grid g2"><div class="card pgHero"><span class="pill">👫 Μαζί</span><h2 style="margin-top:10px">Η θεραπεία γίνεται από δύο</h2><p>Ο/η σύντροφος βλέπει τον κύκλο, τα ραντεβού και τα νέα του εργαστηρίου, παίρνει υπενθυμίσεις για τον ρόλο του/της και στέλνει μηνύματα στήριξης.</p></div><div class="card"><p>Χρειάζεται λογαριασμός (Google ή email) και από τους δύο.</p><button class="btn" data-a="signin">Σύνδεση ή δημιουργία λογαριασμού</button></div></div>`;
  if(S.partnerOf){
    if(!PSUM)partnerLoad();const s=PSUM||{};const nm=esc(S.partnerOf.name||s.name||'η σύντροφός σου');
    if(PSUM&&(PSUM.denied||!PSUM.updatedMs))return `<h1>Σύντροφος</h1><div class="card"><p>${PSUM.denied?'Δεν υπάρχει πλέον πρόσβαση: ίσως αφαιρέθηκε η σύνδεση.':'Η '+nm+' πρέπει να ενεργοποιήσει «Ο γιατρός μου βλέπει τις καταγραφές μου» στην καρτέλα «Ο γιατρός μου», ώστε να βλέπεις τον κύκλο.'}</p><div class="row"><button class="btn alt sm" data-a="pload">↻ Ανανέωση</button><button class="btn ghost" data-a="pleave">Αποσύνδεση από τον λογαριασμό της</button></div></div>`;
    const c=s.cycle||{},ph=pPhase(c),P=PARTNER_PH.find(x=>x[0]===ph)||PARTNER_PH[0];const t=today();
    const appts=(c.appointments||[]).filter(a=>a.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,3);
    const keyd=[['trigger','Trigger'],['opu','Ωοληψία'],['transfer','Εμβρυομεταφορά'],['beta','β-hCG']].filter(([k])=>c[k]&&(k==='trigger'?c[k].slice(0,10):c[k])>=t);
    const meds=(s.meds||[]).filter(m=>(!m.start||m.start<=t)&&(!m.end||m.end>=t));
    const lr=s.lab&&s.lab.recs&&s.lab.recs[s.lab.recs.length-1];
    return `<div class="row between"><h1 style="margin:0">Μαζί με ${nm}</h1><button class="btn ghost" data-a="pload">↻</button></div>
    <div class="grid g2" style="margin-top:14px">
     <div class="card pgHero"><span class="pill">👫 Φάση</span><h2 style="margin-top:10px">${P[1]}</h2><ul class="small">${P[2].map(x=>`<li style="margin:4px 0">${x}</li>`).join('')}</ul></div>
     <div class="card"><h2>Επόμενα</h2>${keyd.map(([k,l])=>`<p style="margin:4px 0">${l}: <b>${k==='trigger'?fmtDT(c[k]):fmtL(c[k])}</b></p>`).join('')}${appts.map(a=>`<p style="margin:4px 0">📅 ${fmtL(a.date)}${a.time?', '+esc(a.time):''}: ${esc(a.title)}</p>`).join('')}${!keyd.length&&!appts.length?'<p class="muted small">Δεν υπάρχουν προγραμματισμένα.</p>':''}
      ${meds.length?`<h3 style="margin-top:12px">Φάρμακα σήμερα</h3>${meds.map(m=>`<p class="small" style="margin:3px 0">💊 <b>${esc(m.name)}</b> ${esc(m.dose||'')} · ${esc(m.times||'')}</p>`).join('')}`:''}</div>
    </div>
    <div class="grid g2" style="margin-top:16px">
     <div class="card"><h2>💌 Στείλε της ένα μήνυμα</h2><div class="chips">${CHEERS.map(x=>`<button class="chip" data-a="cheer" data-t="${esc(x)}">${x}</button>`).join('')}</div><form data-form="cheer" class="row" style="margin-top:10px"><input name="text" placeholder="Γράψε κάτι δικό σου…" required style="flex:1"><button class="btn sm">Αποστολή</button></form></div>
     <div class="card">${lr?`<h2>🧬 Τα έμβρυα</h2>${funnel(lr)}`:'<h2>💜 Για το ζευγάρι</h2><p class="small">Κάντε μαζί τις ασκήσεις του Psy Coach.</p>'}<a class="btn alt sm" href="#coach/couple" style="margin-top:8px">Ασκήσεις ζευγαριού</a></div>
    </div>
    <div class="card soft" style="margin-top:16px"><h2>🧑 Ο ανδρικός παράγοντας</h2><p class="small">Περίπου στο ένα τρίτο έως τη μισή περίπτωση υπογονιμότητας συμβάλλει και ο ανδρικός παράγοντας. Ο τρόπος ζωής επηρεάζει την ποιότητα του σπέρματος, που ανανεώνεται κάθε περίπου 2 με 3 μήνες.</p>
      <details><summary>Κατώτερα όρια αναφοράς σπερμοδιαγράμματος (ΠΟΥ 2021)</summary><div class="inner"><table>${SEMEN.map(([a,b])=>`<tr><td>${a}</td><td><b>${b}</b></td></tr>`).join('')}</table><p class="small muted">Τιμές κάτω από αυτά τα όρια δεν σημαίνουν από μόνες τους υπογονιμότητα. Την ερμηνεία την κάνει ο γιατρός.</p></div></details>
      <p class="small" style="margin-top:8px"><b>Βοηθούν:</b> διακοπή καπνίσματος, λιγότερο αλκοόλ, φυσιολογικό βάρος, άσκηση, αποφυγή υψηλής θερμοκρασίας στους όρχεις (σάουνα, laptop στα πόδια).</p></div>
    <p style="margin-top:12px"><button class="btn ghost" data-a="pleave">Αποσύνδεση από τον λογαριασμό της</button></p>`;
  }
  const partners=CARE.doctors.filter(d=>d.role==='partner');const lc=S.care.lastPCode&&S.care.lastPCode.exp>Date.now()?S.care.lastPCode:null;
  return `<h1>Σύντροφος</h1><div class="grid g2">
   <div class="card"><h2>Πρόσκληση συντρόφου</h2><p class="small">Αν κάνεις τη θεραπεία, δώσε αυτόν τον κωδικό στον/στη σύντροφό σου.</p>
    ${lc?`<div class="codebox">${lc.c}</div><div class="row" style="justify-content:center"><button class="btn alt sm" data-a="pcodeshare">📤 Αποστολή</button><button class="btn ghost" data-a="pgencode">Νέος κωδικός</button></div>`:'<button class="btn coral" data-a="pgencode">Δημιουργία κωδικού</button>'}
    ${partners.length?`<h3 style="margin-top:14px">Συνδεδεμένοι</h3>${partners.map(d=>`<div class="item"><span><b>${esc(d.name)}</b><br><span class="small muted">${esc(d.email||'')}</span></span><button class="btn ghost" data-a="docrevoke" data-id="${d.id}">Αφαίρεση</button></div>`).join('')}`:''}
    <p class="small muted" style="margin-top:8px">Ο/η σύντροφος βλέπει κύκλο, ραντεβού, φάρμακα και έμβρυα, αν είναι ενεργή η κοινοποίηση στο «Ο γιατρός μου». Το προσωπικό ημερολόγιο σκέψεων δεν μοιράζεται ποτέ.</p></div>
   <div class="card"><h2>Είμαι ο/η σύντροφος</h2><p class="small">Βάλε τον κωδικό που σου έδωσε η σύντροφός σου από τη δική της εφαρμογή.</p><form data-form="pjoin" class="row"><input name="code" maxlength="6" style="text-transform:uppercase;letter-spacing:.2em;font-weight:700;flex:1" required><button class="btn">Σύνδεση</button></form></div>
  </div>`;
};

async function partnerSend(text){const p=S.partnerOf;if(!p||!text)return;try{await DB.collection('care').doc(p.pid).collection('inbox').add({type:'cheer',text,from:USER.uid,fromName:USER.displayName||'Ο/η σύντροφός σου',created:Date.now(),read:false});toast('Στάλθηκε 💌')}catch(e){toast('Δεν στάλθηκε')}}

/* ---------- Events ---------- */
let breathTimer=null;
function stopBreath(){clearInterval(breathTimer);breathTimer=null;const b=$('#breath');if(b){b.classList.remove('in');b.textContent='Έτοιμη;'}}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;const a=el.dataset.a;
  if(a==='take'){const d=el.dataset.d;S.taken[d]=S.taken[d]||{};S.taken[d][el.dataset.k]=!S.taken[d][el.dataset.k];save();render();const mid=el.dataset.k.split('@')[0],md=S.meds.find(m=>m.id===mid);if(S.taken[d][el.dataset.k]&&md&&md.type==='inj')injPick(md.name);return}
  e.preventDefault();
  const L=d=>S.logs[d]=S.logs[d]||{symptoms:[],flags:[],mood:0,weight:'',notes:''};
  if(a==='sym'||a==='flag'){const l=L(el.dataset.d),arr=a==='sym'?(l.symptoms=l.symptoms||[]):(l.flags=l.flags||[]);const i=arr.indexOf(el.dataset.k);i<0?arr.push(el.dataset.k):arr.splice(i,1);save();render()}
  if(a==='mood'){const l=L(el.dataset.d);l.mood=+el.dataset.v;save();render()}
  if(a==='delmed'&&confirm('Διαγραφή φαρμάκου;')){S.meds=S.meds.filter(m=>m.id!==el.dataset.id);save();render()}
  if(a==='delscan'){S.scans=S.scans.filter(m=>m.id!==el.dataset.id);save();render()}
  if(a==='delappt'){S.cycle.appointments=S.cycle.appointments.filter(m=>m.id!==el.dataset.id);save();render()}
  if(a==='deljournal'&&confirm('Διαγραφή σημείωσης;')){S.journal=S.journal.filter(m=>m.id!==el.dataset.id);save();render()}
  if(a==='delq'){e.stopPropagation();S.questions=S.questions.filter(m=>m.id!==el.dataset.id);save();render()}
  if(a==='qdone'){const q=S.questions.find(x=>x.id===el.dataset.id);if(q){q.done=!q.done;save();render()}}
  if(a==='addq'){S.questions.push({id:uid(),text:el.dataset.t,done:false});save();render();toast('Προστέθηκε')}
  if(a==='ics')ics();
  if(a==='notif'){if(!('Notification' in window)){toast('Ο browser δεν υποστηρίζει ειδοποιήσεις');return}Notification.requestPermission().then(p=>toast(p==='granted'?'Οι ειδοποιήσεις ενεργοποιήθηκαν':'Οι ειδοποιήσεις δεν επιτράπηκαν'))}
  if(a==='signin'){signIn();return}
  if(a==='signout'){signOut();return}
  if(a==='delcloud'){deleteCloud();return}
  if(a==='acctmenu'){const m=$('#amenu');if(m)m.hidden=!m.hidden;return}
  if(a==='closemenu'){const m=$('#amenu');if(m)m.hidden=true;location.hash=el.getAttribute('href');return}
  if(a==='rmail'||a==='rshare'||a==='rprint'||a==='rcopy'){refreshReport();const r=lastReport,o=reportOpts();if(!r)return;
    if(o&&o.email){if(o.to==='psy')S.clinic.psyEmail=o.email;else if(o.to==='gyn')S.clinic.email=o.email;save()}
    if(a==='rmail'){location.href='mailto:'+encodeURIComponent(o.email||'')+'?subject='+encodeURIComponent(r.subject)+'&body='+encodeURIComponent(r.text)}
    if(a==='rcopy'){navigator.clipboard.writeText(r.text).then(()=>toast('Αντιγράφηκε'),()=>toast('Δεν ήταν δυνατή η αντιγραφή'))}
    if(a==='rshare'){const f=new File([r.html],'anafora-'+today()+'.html',{type:'text/html'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:r.subject,text:r.subject}).catch(()=>{})}else{download(new Blob([r.html],{type:'text/html'}),f.name);toast('Το αρχείο κατέβηκε: επισύναψέ το στο email σου')}}
    if(a==='rprint'){const w=window.open('','_blank');if(!w){toast('Επίτρεψε τα αναδυόμενα παράθυρα');return}w.document.write(r.html);w.document.close();setTimeout(()=>w.print(),400)}
    return}
  if(a==='pday'){selDay=el.dataset.d;calMonth=selDay.slice(0,7);render();return}
  if(a==='calnav'){const [y,m]=(calMonth||today().slice(0,7)).split('-').map(Number);const d=new Date(y,m-1+(+el.dataset.v),1);calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render();return}
  if(a==='pnow'){const p=PD(),t=today();if(!p.starts.includes(t))p.starts.push(t);p.starts.sort();p.days[t]=Object.assign(p.days[t]||{},{flow:Math.max(3,(p.days[t]||{}).flow||0)});selDay=t;save();render();toast('Καταγράφηκε η 1η ημέρα περιόδου');return}
  if(a==='pend'){const p=PD(),cs=p.starts.filter(x=>x<=today()).pop();if(cs){p.ends[cs]=addDays(today(),-1)<cs?cs:today();save();render();toast('Καταγράφηκε το τέλος της περιόδου')}return}
  if(a==='pdel'){const p=PD();if(confirm('Διαγραφή αυτής της περιόδου;')){p.starts=p.starts.filter(x=>x!==el.dataset.d);delete p.ends[el.dataset.d];save();render()}return}
  if(['pflow','ppain','pmucus','plh'].includes(a)){const p=PD(),d=selDay||today(),L=p.days[d]=p.days[d]||{};const key={pflow:'flow',ppain:'pain',pmucus:'mucus',plh:'lh'}[a];const v=a==='pflow'||a==='ppain'?+el.dataset.v:el.dataset.v;L[key]=(L[key]===v&&a==='pmucus')?'':v;
    if(a==='pflow'&&v>=2&&!p.starts.some(s=>s<=d&&days(s,d)<10)){p.starts.push(d);p.starts.sort();toast('Καταγράφηκε νέα περίοδος: '+fmt(d))}
    save();render();return}
  if(a==='pmood'||a==='ptog'||a==='pclots'||a==='ppads'||a==='parr'){const p=PD(),d=selDay||today(),L=p.days[d]=p.days[d]||{};
    if(a==='pmood')L.mood=L.mood===+el.dataset.v?0:+el.dataset.v;
    if(a==='ptog')L[el.dataset.f]=!L[el.dataset.f];
    if(a==='pclots')L.clots=el.dataset.v;
    if(a==='ppads')L.pads=Math.max(0,(L.pads||0)+(+el.dataset.v));
    if(a==='parr'){const arr=L[el.dataset.f]=L[el.dataset.f]||[];const i=arr.indexOf(el.dataset.v);i<0?arr.push(el.dataset.v):arr.splice(i,1)}
    save();render();return}
  if(a==='contr'){const g=PG(),st=cStats();if(st.active)st.active.e=Date.now();else{g.contr.push({s:Date.now()});g.contr=g.contr.filter(c=>c.s>Date.now()-48*3600000)}save();render();checkContr();return}
  if(a==='closeAlert'){document.querySelector('.modal.calert')?.remove();if(el.getAttribute('href'))location.hash=el.getAttribute('href');return}
  if(a==='cclear'){if(confirm('Διαγραφή όλων των καταγεγραμμένων συσπάσεων;')){PG().contr=[];save();render()}return}
  if(a==='kickstart'){PG().kicks.push({start:Date.now(),count:0});save();render();return}
  if(a==='kick'){const k=kickActive();if(k){k.count++;if(navigator.vibrate)navigator.vibrate(40);if(k.count===10){k.end=Date.now();toast('10 κινήσεις σε '+Math.round((k.end-k.start)/60000)+' λεπτά 💜')}save();render()}return}
  if(a==='kickend'){const k=kickActive();if(k){k.end=Date.now();save();render()}return}
  if(a==='pgedit'){PG().active=false;save();render();return}
  if(a==='pgstop'){if(confirm('Να σταματήσει η παρακολούθηση εγκυμοσύνης; Τα δεδομένα δεν θα διαγραφούν.')){PG().active=false;PG().lmp='';save();location.hash='today'}return}
  if(a==='pgfromet'){const f=el.closest('form');f.lmp.value=el.dataset.v;f.edd.value='';toast('Υπολογίστηκε από την εμβρυομεταφορά');return}
  if(a==='injlog'||a==='injpick'){const m=el.closest('.modal');S.inj=S.inj||[];S.inj.push({t:Date.now(),zone:el.dataset.z,med:m?m.dataset.med:''});save();if(m)m.remove();toast('Καταγράφηκε: '+(ZONES.find(z=>z[0]===el.dataset.z)||[])[1]);render();return}
  if(a==='injdel'){S.inj=(S.inj||[]).filter(i=>String(i.t)!==el.dataset.t);save();render();return}
  if(a==='labnewc'){LAB().cur=null;S.lab.recs.length&&(S.lab._new=true);render();return}
  if(a==='bldel'){const r=labCur();r.blasts=r.blasts.filter(b=>b.id!==el.dataset.id);save();render();return}
  if(a==='cheer'){partnerSend(el.dataset.t);return}
  if(a==='pload'){PSUM=null;partnerLoad(true);return}
  if(a==='pleave'){if(confirm('Αποσύνδεση από τον λογαριασμό της συντρόφου σου;')){const p=S.partnerOf;DB.collection('care').doc(p.pid).collection('doctors').doc(USER.uid).delete().catch(()=>{});S.partnerOf=null;PSUM=null;save();render()}return}
  if(a==='pgencode'){genCode('partner');return}
  if(a==='pcodeshare'){const c=S.care.lastPCode.c,t='Ο κωδικός μου για να συνδεθείς στο Baby O’Clock ως σύντροφος: '+c+'\n'+location.origin+location.pathname+'#partner';if(navigator.share)navigator.share({text:t}).catch(()=>{});else navigator.clipboard.writeText(t).then(()=>toast('Αντιγράφηκε'));return}
  if(a==='inbimport'){inboxImport(el.dataset.id);return}
  if(a==='inbread'){DB.collection('care').doc(USER.uid).collection('inbox').doc(el.dataset.id).update({read:true}).catch(()=>{});return}
  if(a==='gencode'){genCode();return}
  if(a==='codeshare'){const c=S.care.lastCode.c,t='Γιατρέ, ο κωδικός σύνδεσης για την εφαρμογή Baby O’Clock είναι: '+c+'\nΠύλη γιατρών: '+DOC_URL()+'?code='+c;if(navigator.share)navigator.share({text:t}).catch(()=>{});else navigator.clipboard.writeText(t).then(()=>toast('Αντιγράφηκε'));return}
  if(a==='docrevoke'){if(confirm('Να αφαιρεθεί η πρόσβαση αυτού του γιατρού;'))DB.collection('care').doc(USER.uid).collection('doctors').doc(el.dataset.id).delete().then(()=>toast('Αφαιρέθηκε')).catch(()=>toast('Σφάλμα'));return}
  if(a==='fopen'){fileOpen(el.dataset.id);return}
  if(a==='mclose'){el.closest('.modal').remove();return}
  if(a==='fshare'){const f=S.files.find(x=>x.id===el.dataset.id);fileData(f.id).then(async d=>{const blob=await (await fetch(d)).blob();const file=new File([blob],(f.title||'exetasi')+(f.type==='pdf'?'.pdf':'.jpg'),{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:f.title}).catch(()=>{});else download(blob,file.name)});return}
  if(a==='fdel'){if(!confirm('Οριστική διαγραφή του αρχείου;'))return;const id=el.dataset.id;S.files=S.files.filter(x=>x.id!==id);IDB.del(id);if(USER)DB.collection('users').doc(USER.uid).collection('files').doc(id).delete().catch(()=>{});save();el.closest('.modal').remove();render();return}
  if(a==='life'){const t=today(),l=S.logs[t]=S.logs[t]||{symptoms:[],flags:[],mood:0,weight:'',notes:''};l[el.dataset.k]=Math.max(0,Math.round(((l[el.dataset.k]||0)+(+el.dataset.v))*10)/10);save();render();return}
  if(a==='suppre'){const f=document.querySelector('form[data-form=med]');f.name.value=el.dataset.v;f.type.value='supp';f.dose.focus();return}
  if(a==='vdel'){PG().vitals=PG().vitals.filter(v=>v.id!==el.dataset.id);save();render();return}
  if(a==='feed'){BB().feeds.push({s:Date.now(),type:'breast',side:el.dataset.v});save();render();return}
  if(a==='feedstop'){const f=BB().feeds.find(x=>!x.e&&x.type==='breast');if(f)f.e=Date.now();save();render();return}
  if(a==='diaper'){const b=BB(),d=b.diapers[today()]=b.diapers[today()]||{wet:0,dirty:0};d[el.dataset.k]=Math.max(0,(d[el.dataset.k]||0)+(+el.dataset.v));save();render();return}
  if(a==='vacc'){const b=BB();b.vacc[el.dataset.v]=!b.vacc[el.dataset.v];save();render();return}
  if(a==='theme'){localStorage.setItem('bo-theme',el.dataset.v);applyTheme();render();return}
  if(a==='lockoff'){if(confirm('Απενεργοποίηση κλειδώματος;')){localStorage.removeItem(LOCKK);render()}return}
  if(a==='bioon'){bioRegister().then(id=>{const c=lockCfg();c.bio=id;localStorage.setItem(LOCKK,JSON.stringify(c));toast('Ενεργοποιήθηκε');render()}).catch(()=>toast('Δεν ήταν δυνατή η ενεργοποίηση'));return}
  if(a==='stress'){S.coach.stress[today()]=+el.dataset.v;save();render()}
  if(a==='exdone'){const id=el.dataset.id,d=S.coach.done[id]=S.coach.done[id]||[],i=d.indexOf(today());i<0?d.push(today()):d.splice(i,1);save();const op=el.closest('details')?.id;render();if(op){const x=document.getElementById(op);if(x)x.open=true}}
  if(a==='delcheck'){S.coach.checkins=S.coach.checkins.filter(c=>c.id!==el.dataset.id);save();render()}
  if(a==='timer'){const span=el.parentElement.querySelector('span');let s=+el.dataset.m*60;clearInterval(window._ct);const up=()=>{span.textContent=Math.floor(s/60)+':'+pad(s%60);if(s--<=0){clearInterval(window._ct);span.textContent='Τέλος χρόνου! 💞';notify('Τέλος χρόνου','Η άσκηση ολοκληρώθηκε')}};up();window._ct=setInterval(up,1000)}
  if(a==='breath'){stopBreath();const b=$('#breath');let n=0,inhale=true;const step=()=>{if(!$('#breath')||n>=18){stopBreath();return}b.classList.toggle('in',inhale);b.style.transitionDuration=(inhale?4:6)+'s';b.textContent=inhale?'Εισπνοή':'Εκπνοή';clearTimeout(breathTimer);breathTimer=setTimeout(()=>{inhale=!inhale;if(inhale)n++;step()},(inhale?4:6)*1000)};step()}
  if(a==='breathstop'){clearTimeout(breathTimer);stopBreath()}
  if(a==='export'){download(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),'baby-oclock-backup-'+today()+'.json');toast('Το αντίγραφο αποθηκεύτηκε')}
  if(a==='wipe'&&confirm('Θα διαγραφούν οριστικά όλα τα δεδομένα από αυτή τη συσκευή. Συνέχεια;')){localStorage.removeItem(KEY);S=structuredClone(blank);render();onboard()}
});
document.addEventListener('input',e=>{if(e.target.closest('form[data-form=report]'))refreshReport();if(e.target.dataset.a==='pscrub'){selDay=addDays(e.target.dataset.s,+e.target.value-1);const v=e.target.value;render();const r=document.querySelector('[data-a=pscrub]');if(r){r.value=v;r.focus()}}});
document.addEventListener('click',e=>{const m=$('#amenu');if(m&&!m.hidden&&!e.target.closest('.acct'))m.hidden=true},true);
document.addEventListener('change',e=>{if(e.target.dataset.a==='labsel'){LAB().cur=e.target.value;save();render();return}if(e.target.dataset.a==='automail'){PG().autoMail=e.target.checked;save();}if(e.target.dataset.a==='careshare'){S.care.share=e.target.checked;save();if(S.care.share)shareSync();else if(USER)DB.collection('care').doc(USER.uid).delete().catch(()=>{});toast(S.care.share?'Ο γιατρός σου βλέπει τις καταγραφές σου':'Η κοινοποίηση σταμάτησε')}if(e.target.closest('form[data-form=report]'))refreshReport();
  const el=e.target;
  if(el.dataset.a==='diarydate'&&el.value)location.hash='diary/'+el.value;
  if(el.dataset.a==='import'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{S=Object.assign(structuredClone(blank),JSON.parse(r.result));save();render();toast('Η επαναφορά ολοκληρώθηκε')}catch(x){toast('Μη έγκυρο αρχείο')}};r.readAsText(el.files[0])}
});
document.addEventListener('submit',e=>{
  const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();const v=Object.fromEntries(new FormData(f));
  if(k==='cycle'){Object.assign(S.cycle,{protocol:v.protocol||'',start:v.start||'',trigger:v.trigger||'',opu:v.opu||'',transfer:v.transfer||'',stage:v.stage||'5',beta:v.beta||''});toast('Ο κύκλος αποθηκεύτηκε')}
  if(k==='appt'){S.cycle.appointments=S.cycle.appointments||[];S.cycle.appointments.push({id:uid(),...v});toast('Το ραντεβού προστέθηκε')}
  if(k==='med'){S.meds.push({id:uid(),...v});toast('Το φάρμακο προστέθηκε')}
  if(k==='scan'){S.scans.push({id:uid(),...v});toast('Αποθηκεύτηκε')}
  if(k==='log'){const d=f.dataset.d;S.logs[d]=Object.assign(S.logs[d]||{symptoms:[],flags:[],mood:0},{weight:v.weight,notes:v.notes});toast('Αποθηκεύτηκε')}
  if(k==='journal'){S.journal.push({id:uid(),date:today(),text:v.text});toast('Αποθηκεύτηκε')}
  if(k==='reflect'){S.coach.notes[f.dataset.id]=v.text;save();toast('Αποθηκεύτηκε');const op=f.closest('details')?.id;render();if(op){const x=document.getElementById(op);if(x)x.open=true}return}
  if(k==='record'){S.coach.records.push({id:uid(),date:today(),...v});save();toast('Αποθηκεύτηκε');render();const x=document.getElementById('ex-record');if(x)x.open=true;return}
  if(k==='checkin'){S.coach.checkins.push({id:uid(),date:today(),...v});toast('Το check-in αποθηκεύτηκε')}
  if(k==='report')return;
  if(k==='labnew'){const L=LAB();const r={id:uid(),opu:v.opu,method:v.method,blasts:[],updates:[]};L.recs.push(r);L.cur=r.id;delete L._new;toast('Έτοιμο')}
  if(k==='labnum'){const r=labCur();['eggs','mii','fert','d3','blast','euploid'].forEach(x=>r[x]=v[x]===''?'':+v[x]);toast('Αποθηκεύτηκε')}
  if(k==='blast'){const r=labCur();r.blasts=r.blasts||[];r.blasts.push({id:uid(),day:v.day,grade:(v.grade||'').toUpperCase().replace(/\s/g,''),pgt:v.pgt,status:v.status})}
  if(k==='labupd'){const r=labCur();r.updates=r.updates||[];r.updates.push({date:today(),text:v.text})}
  if(k==='cheer'){partnerSend(v.text);f.reset();return}
  if(k==='pjoin'){partnerJoin(v.code);return}
  if(k==='fileadd'){const file=f.f.files[0];if(!file)return;const st=$('#fstat');st.textContent='Επεξεργασία…';compressFile(file).then(async data=>{const meta={id:uid(),title:v.title||'',cat:v.cat,date:v.date||today(),cycle:v.cycle||curCycleLabel(),type:file.type==='application/pdf'?'pdf':'img',synced:false};await IDB.put({id:meta.id,data});S.files=S.files||[];S.files.push(meta);save();if(await fileUp(meta,data)){meta.synced=true;save()}toast('Αποθηκεύτηκε');render()}).catch(()=>{st.textContent='Το αρχείο είναι πολύ μεγάλο ή δεν υποστηρίζεται (PDF έως 700 KB).'});return}
  if(k==='wb'){const ans=[];const sc={};WB.forEach(([d,qs],di)=>{const a=qs.map((_,qi)=>+v['q'+di+'_'+qi]);ans.push(...a);sc[d]=Math.round(a.reduce((x,y)=>x+y,0)/a.length*25)});const total=Math.round(Object.values(sc).reduce((x,y)=>x+y,0)/4);S.coach.wb=S.coach.wb||[];S.coach.wb.push({date:today(),ans,sc,total});toast('Αποθηκεύτηκε')}
  if(k==='psybook'){S.clinic.psyEmail=v.email||S.clinic.psyEmail;save();const body='Καλησπέρα σας,\n\nθα ήθελα να κλείσω ραντεβού.\n\nΕίδος: '+v.who+'\nΤρόπος: '+v.mode+'\nΠροτιμώμενες ημέρες: '+(v.days||'-')+'\nΠροτιμώμενη ώρα: '+(v.hours||'-')+(v.note?'\n\n'+v.note:'')+'\n\n'+(S.profile.name||'')+(S.profile.phone?'\nΤηλ.: '+S.profile.phone:'')+'\n\n(μέσω της εφαρμογής Baby O’Clock)';location.href='mailto:'+encodeURIComponent(v.email||'')+'?subject='+encodeURIComponent('Αίτημα ραντεβού'+(S.profile.name?': '+S.profile.name:''))+'&body='+encodeURIComponent(body);return}
  if(k==='vital'){const g=PG();g.vitals=g.vitals||[];if(!v.w&&!v.sys&&!v.glu){toast('Συμπλήρωσε τουλάχιστον μία μέτρηση');return}g.vitals.push({id:uid(),...v});const fl=vitFlag(v);toast(fl.length?'Αποθηκεύτηκε: δες την ειδοποίηση':'Αποθηκεύτηκε');if(fl.some(x=>x[0]==='red'))notify('⚠️ Μέτρηση εκτός ορίων',fl[0][1])}
  if(k==='babyset'){const b=BB();b.born=v.born;b.name=v.name||'';toast('Συγχαρητήρια! 💜')}
  if(k==='bottle'){if(+v.ml>0)BB().feeds.push({s:Date.now(),e:Date.now(),type:'bottle',ml:+v.ml})}
  if(k==='pmood'){const a=PHQ.map((_,i)=>+v['p'+i]);BB().mood.push({date:today(),ans:a,d:a[0]+a[1],a:a[2]+a[3]});toast(a[0]+a[1]>=3||a[2]+a[3]>=3?'Αξίζει να μιλήσεις με τον γιατρό ή την ψυχολόγο σου 💜':'Αποθηκεύτηκε')}
  if(k==='lockset'){if(v.p1!==v.p2){toast('Τα PIN δεν ταιριάζουν');return}const salt=uid()+uid();sha(salt+v.p1).then(hh=>{localStorage.setItem(LOCKK,JSON.stringify({salt,hash:hh,len:v.p1.length}));toast('Το κλείδωμα ενεργοποιήθηκε');render()});return}
  if(k==='pgset'){const g=PG();let lmp=v.lmp;if(v.edd)lmp=addDays(v.edd,-280);if(!lmp){toast('Βάλε μία από τις δύο ημερομηνίες');return}g.lmp=lmp;g.active=true;toast('Η παρακολούθηση εγκυμοσύνης ξεκίνησε 💜')}
  if(k==='pstart'){const p=PD();p.len=+v.len||28;p.bleed=+v.bleed||5;p.starts=[v.start];p.ends[v.start]=addDays(v.start,p.bleed-1);selDay=today();toast('Έτοιμο! Δες τι συμβαίνει σήμερα')}
  if(k==='padd'){const p=PD();if(!p.starts.includes(v.start)){p.starts.push(v.start);p.starts.sort()}toast('Προστέθηκε')}
  if(k==='pset'){const p=PD();p.len=+v.len||28;p.bleed=+v.bleed||5;toast('Αποθηκεύτηκε')}
  if(k==='pday'){const p=PD(),d=selDay||today();p.days[d]=Object.assign(p.days[d]||{},{temp:v.temp,notes:v.notes});toast('Αποθηκεύτηκε')}
  if(k==='q'){S.questions.push({id:uid(),text:v.text,done:false})}
  if(k==='clinic'){Object.assign(S.clinic,v);toast('Αποθηκεύτηκε')}
  if(k==='profile'){S.profile.name=v.name;S.profile.phone=v.phone||'';toast('Αποθηκεύτηκε')}
  if(k==='onboard'){S.profile.name=v.name||'';S.profile.onboarded=true;document.querySelector('.modal')?.remove()}
  save();render();
});

/* ---------- Onboarding ---------- */
function onboard(){
  if(S.profile.onboarded)return;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card"><img src="icon.svg" alt="" width="56"><h2 style="margin-top:10px">Καλώς ήρθες</h2><p>Το «Baby O’Clock» είναι ο βοηθός σου στην εξωσωματική. Σε βοηθά να οργανώσεις τον κύκλο σου: φάρμακα, ραντεβού, συμπτώματα, και να καταλαβαίνεις κάθε βήμα.</p><ul class="small"><li>Τα δεδομένα σου μένουν <b>στη συσκευή σου</b>, ή στον <b>λογαριασμό σου Google</b> αν συνδεθείς. Κανείς άλλος δεν τα βλέπει.</li><li>Η εφαρμογή <b>δεν αντικαθιστά</b> τις οδηγίες του γιατρού σου.</li><li>Σε έντονα συμπτώματα, καλείς την κλινική.</li><li>Στο <b>Fertility Psy Coach</b> θα βρεις ασκήσεις για εσένα και για το ζευγάρι.</li></ul><form data-form="onboard"><label>Πώς να σε λέω; (προαιρετικό)</label><input name="name"><button class="btn" style="margin-top:14px;width:100%;justify-content:center">Ξεκινάμε</button></form><p class="small muted" style="text-align:center;margin-top:12px">Έχεις ήδη λογαριασμό; <a href="#" data-a="signin" onclick="this.closest('.modal').remove()">Σύνδεση</a> για να φέρεις τις καταγραφές σου.</p></div>`;
  document.body.appendChild(m);
}

/* ---------- Router ---------- */
function render(){const r=route().split('/')[0];const fn=V[r]||V.today;if(r!=='coach')clearTimeout(breathTimer);$('#app').innerHTML=fn();nav();if(r==='preg'||r==='baby')startTickers();else clearInterval(contrTick);if(r==='files')hydrateThumbs()}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
applyTheme();render();onboard();acct();fbInit();showLock();
setInterval(tick,30000);tick();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
