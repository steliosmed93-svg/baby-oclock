<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby O’Clock · Ο βοηθός σου στην εξωσωματική</title>
<meta name="description" content="Εφαρμογή για γυναίκες σε κύκλο εξωσωματικής: φάρμακα και υπενθυμίσεις, ραντεβού, ημερολόγιο συμπτωμάτων, υπερηχογραφήματα, γνώση και ψυχολογική στήριξη. Τα δεδομένα μένουν μόνο στη συσκευή σου.">
<meta name="theme-color" content="#2f7f7a">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var t=localStorage.getItem("bo-theme")||"auto";document.documentElement.dataset.theme=(t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){}</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby O’Clock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f2; --surface:#ffffff; --surface2:#f6efe9; --ink:#2b2a33; --muted:#6f6b75;
  --line:#ece3dc; --coral:#e9775a; --coral-soft:#fde7df; --teal:#2f7f7a; --teal-soft:#dcefed;
  --lilac:#8a78c2; --lilac-soft:#ece8f8; --gold:#c99a2e; --gold-soft:#fbf1d9; --red:#c8433b; --red-soft:#fbe3e1;
  --radius:18px; --shadow:0 6px 24px rgba(60,40,30,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Commissioner,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--teal)}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.3em 0 .8em}
.muted{color:var(--muted)} .small{font-size:.88rem}
header.top{position:sticky;top:0;z-index:20;background:rgba(251,246,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 18px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;color:var(--ink);font-size:1.05rem}
.brand img{width:34px;height:34px}
.deskNav{display:none;margin-left:auto;gap:2px;flex-wrap:nowrap}
.deskNav a{white-space:nowrap;padding:7px 9px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.88rem}
.deskNav a.on{background:var(--teal-soft);color:var(--teal)}
main{max-width:1100px;margin:0 auto;padding:18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;padding:4px 0;border-radius:12px}
.tabbar a svg{width:24px;height:24px}
.tabbar a.on{color:var(--teal);font-weight:600}
@media(min-width:900px){.tabbar{display:none}.deskNav{display:flex}body{padding-bottom:30px}main{padding:28px 18px}}
.grid{display:grid;gap:16px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.soft{background:var(--surface2);box-shadow:none}
.hero{background:linear-gradient(135deg,#f6a389 0%,#e9775a 40%,#2f7f7a 100%);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.85)}
.big{font-size:2.4rem;font-weight:700;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--teal-soft);color:var(--teal)}
.pill.coral{background:var(--coral-soft);color:#b4513a}.pill.lilac{background:var(--lilac-soft);color:#5e4c9c}.pill.gold{background:var(--gold-soft);color:#8a6612}.pill.red{background:var(--red-soft);color:var(--red)}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{appearance:none;border:0;background:var(--teal);color:#fff;font:inherit;font-weight:600;padding:11px 16px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.coral{background:var(--coral)}
.btn.ghost{background:transparent;color:var(--teal);padding:6px 8px}
.btn.danger{background:var(--red)}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:10px}
.hero .btn.alt{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35)}
label{display:block;font-size:.88rem;font-weight:600;margin:10px 0 4px;color:#4a4652}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-soft);border-color:var(--teal)}
.fields{display:grid;gap:0 14px}
@media(min-width:600px){.fields.two{grid-template-columns:1fr 1fr}}
.check{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fff;cursor:pointer}
.check .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--teal);display:grid;place-items:center;flex:none}
.check.done{background:var(--teal-soft);border-color:transparent}
.check.done .box{background:var(--teal)}
.check.done .box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{font-weight:700;min-width:52px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--coral-soft);border-color:var(--coral);color:#9b3f29;font-weight:600}
.chip.flag.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.moods{display:flex;gap:8px}
.moods button{font-size:1.6rem;border:2px solid transparent;background:var(--surface2);border-radius:14px;padding:6px 10px;cursor:pointer}
.moods button.on{border-color:var(--coral);background:var(--coral-soft)}
.timeline{list-style:none;padding:0;margin:0;position:relative}
.timeline li{position:relative;padding:0 0 18px 34px}
.timeline li::before{content:"";position:absolute;left:10px;top:8px;bottom:-8px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{position:absolute;left:2px;top:4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.timeline li.past .dot{background:var(--teal);border-color:var(--teal)}
.timeline li.now .dot{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 6px var(--coral-soft)}
.timeline li.now h3{color:#b4513a}
details{border:1px solid var(--line);border-radius:14px;background:#fff;margin:10px 0;overflow:hidden}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--teal);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details .inner{padding:0 16px 14px}
.alert{border-radius:16px;padding:14px 16px;background:var(--red-soft);border:1px solid #f1bcb7;color:#7d2620}
.alert.info{background:var(--gold-soft);border-color:#efdca8;color:#6b500f}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem}
.stat{display:flex;flex-direction:column}
.stat b{font-size:1.5rem}
.breath{width:190px;height:190px;border-radius:50%;margin:20px auto;background:radial-gradient(circle,#fff 0%,var(--teal-soft) 60%,#bfe2de 100%);display:grid;place-items:center;font-weight:700;color:var(--teal);transition:transform 4s ease-in-out;transform:scale(.7)}
.breath.in{transform:scale(1)}
.chart{width:100%;height:auto}
.modal{position:fixed;inset:0;background:rgba(30,25,35,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:.92rem;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.foot{max-width:1100px;margin:10px auto 0;padding:0 18px 20px;font-size:.82rem;color:var(--muted)}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 18px;padding-bottom:4px;scrollbar-width:none}
.subtabs a{white-space:nowrap;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem}
.subtabs a.on{background:var(--lilac);border-color:var(--lilac);color:#fff}
.coachHero{background:linear-gradient(135deg,#8a78c2 0%,#b58fc9 45%,#e9775a 100%);color:#fff;border:0}
.coachHero .pill{background:rgba(255,255,255,.22);color:#fff}
.coachMini{background:linear-gradient(180deg,#fff 0%,var(--lilac-soft) 100%)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:10px 0}
.scale button{border:0;border-radius:10px;padding:10px 0;font:inherit;font-weight:700;cursor:pointer;background:hsl(var(--h),60%,92%);color:hsl(var(--h),45%,30%)}
.scale button.on{background:hsl(var(--h),55%,45%);color:#fff;transform:scale(1.08)}
.vcard{border-color:#d9d0f0;background:linear-gradient(135deg,#fff 0%,var(--lilac-soft) 100%)}
.vav{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.3rem;color:#fff;background:linear-gradient(135deg,#8a78c2,#e9775a);flex:none}
.btn.lil{background:var(--lilac)}
details.ex summary{font-weight:600}
.vstrip{background:var(--lilac-soft);border-top:1px solid #ddd3f3;margin-top:28px}
.vin{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;color:#4b3f7a}
.vin a{color:#5e4c9c;font-weight:600}
.acct{margin-left:auto;position:relative;flex:none}
@media(min-width:900px){.acct{margin-left:6px}}
.gbtn{background:#fff;color:#3c4043;border:1px solid #dadce0;font-weight:600}
.gbtn:hover{background:#f8f9fa}
.showS{display:none}@media(max-width:520px){.hideS{display:none}.showS{display:inline}}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid var(--lilac);padding:0;overflow:visible;background:var(--lilac-soft);cursor:pointer;position:relative;display:grid;place-items:center;font-weight:700;color:#5e4c9c}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar .dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:#bbb}
.avatar .dot.ok{background:#2e9d6a}.avatar .dot.sync{background:var(--gold)}.avatar .dot.err{background:var(--red)}
.amenu{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:14px;min-width:260px;display:flex;flex-direction:column;gap:6px;z-index:40}
.amenu hr{border:0;border-top:1px solid var(--line);width:100%;margin:6px 0}
.amenu a,.amenu button{all:unset;cursor:pointer;padding:8px 6px;border-radius:8px;color:var(--ink)}
.amenu a:hover,.amenu button:hover{background:var(--surface2)}
.pHero{background:linear-gradient(135deg,#f6a389,#e9775a 50%,#a996d9);color:#fff;border:0}.pHero .pill{background:rgba(255,255,255,.25);color:#fff}
.wheelWrap{position:relative;max-width:340px;margin:0 auto}
.wheel{width:100%;height:auto;display:block}
.wheel .seg{cursor:pointer;transition:opacity .2s,transform .2s;transform-origin:170px 170px}
.wheel .seg:hover{opacity:.8}
.wheel .seg.sel{filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.wheelC{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.wheelC .big{font-size:3rem;line-height:1.05;transition:color .3s}
.dayCard{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat2{display:flex;flex-direction:column;background:var(--surface2);border-radius:14px;padding:10px 6px}
.stat2 b{font-size:1.4rem}.stat2 span{font-size:.78rem;line-height:1.25}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .wd{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600}
.cday{position:relative;aspect-ratio:1;border:0;border-radius:12px;background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);border:1px solid var(--line)}
.cday.c-per{background:#e9775a;color:#fff;border-color:#e9775a}
.cday.c-perp{background:repeating-linear-gradient(45deg,#fde1d8,#fde1d8 4px,#fff 4px,#fff 8px);border-color:#f2b3a1}
.cday.c-fert{background:#d5f0ec;border-color:#8fd1c8}
.cday.c-ov{background:#2f7f7a;color:#fff;border-color:#2f7f7a}
.cday.c-today{box-shadow:0 0 0 2px var(--ink) inset}
.cday.c-sel{transform:scale(1.08);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.cday .mk{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:.55rem;font-style:normal;background:#c99a2e;color:#fff;border-radius:4px;padding:0 3px}
.cday .dot2{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--lilac)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bars span{width:100%;max-width:34px;border-radius:8px 8px 4px 4px}
.bars b{font-size:.85rem}
.pMini .big{color:var(--ink)}
.pgHero{background:linear-gradient(135deg,#8a78c2,#b58fc9 55%,#f6a389);color:#fff;border:0}.pgHero .pill{background:rgba(255,255,255,.25);color:#fff}
.pgw small{font-size:.5em;opacity:.85}.pgHero .big{font-size:3.4rem}
.pbar{height:10px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:12px;overflow:hidden}.pbar span{display:block;height:100%;background:#fff;border-radius:99px}
.cstatus{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 14px;margin:6px 0 14px}
.cstatus.ok{background:var(--teal-soft);color:#1f5b57}.cstatus.amber{background:var(--gold-soft);color:#6b500f}.cstatus.red{background:var(--red-soft);color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(200,67,59,.15)}}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:170px;height:170px;border-radius:50%;margin:6px auto 16px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;background:radial-gradient(circle at 30% 30%,#f6a389,#e9775a);box-shadow:0 10px 30px rgba(233,119,90,.35);transition:transform .15s}
.cbtn:active{transform:scale(.96)}.cbtn.on{background:radial-gradient(circle at 30% 30%,#b58fc9,#8a78c2);box-shadow:0 0 0 10px rgba(138,120,194,.2);animation:pulse2 1.6s infinite}
.cbtn b{font-size:2rem;margin-top:4px}
@keyframes pulse2{50%{box-shadow:0 0 0 18px rgba(138,120,194,.08)}}
.kbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;margin:6px auto;border:0;cursor:pointer;font:inherit;color:#fff;background:radial-gradient(circle at 30% 30%,#8fd1c8,#2f7f7a)}
.kbtn b{font-size:2.6rem}.kbtn span{font-size:.8rem}
.redt{color:var(--red)}
.bleed{background:var(--coral-soft);border-radius:14px;padding:12px;margin-top:10px}
.flowbars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:10px}
.flowbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.flowbars span{width:100%;max-width:26px;background:#e9775a;border-radius:6px}
.flowbars i{font-style:normal;font-size:.7rem;color:var(--muted)}
.codebox{font-size:2.4rem;font-weight:700;letter-spacing:.3em;text-align:center;padding:16px;border:2px dashed var(--teal);border-radius:16px;margin:10px 0;color:var(--teal)}
.inb.unread{border-left:6px solid var(--coral)}
.inbnote{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);margin-top:16px;background:var(--teal-soft);border:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;cursor:pointer;font:inherit;color:var(--ink)}
.fcard img,.fpdf{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--surface2)}
.fpdf{display:grid;place-items:center;font-weight:700;color:var(--red)}
.lifegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(min-width:760px){.lifegrid{grid-template-columns:repeat(6,1fr)}}
.lifec{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface2);border-radius:14px;padding:10px 4px;text-align:center}
.lifec>span:first-child{font-size:1.5rem}.lifec b{font-size:1.4rem}
.chip.rad{position:relative}.chip.rad input{position:absolute;opacity:0;width:1px;height:1px;left:50%;bottom:0}.chip.rad:has(input:checked){background:var(--coral-soft);border-color:var(--coral);font-weight:600}
.legal h3{margin-top:18px}
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#2f7f7a,#8a78c2);color:#fff;display:grid;place-items:center}
.lockin{text-align:center}.dots i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #fff;margin:6px}.dots i.on{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin:18px auto;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:1.5rem;cursor:pointer}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

const fmtL=s=>{if(!s)return '';const d=parse(s);return GRD[d.getDay()]+' '+d.getDate()+' '+GRM[d.getMonth()]};

/* ---------- Content ---------- */
const PROTOCOLS={
 antagonist:{name:'Πρωτόκολλο ανταγωνιστή',short:'Ανταγωνιστή',kind:'stim',steps:[
  ['start','Έναρξη διέγερσης','Συνήθως τη 2η ή 3η ημέρα της περιόδου ξεκινούν οι καθημερινές ενέσεις γοναδοτροπινών (FSH ή FSH/LH). Στόχος είναι να αναπτυχθούν περισσότερα από ένα ωοθυλάκια.'],
  ['antag','Προσθήκη ανταγωνιστή','Γύρω στην 5η με 6η ημέρα διέγερσης (ή όταν τα θυλάκια μεγαλώσουν) προστίθεται δεύτερη ένεση, ο ανταγωνιστής. Εμποδίζει την πρόωρη ωορρηξία, ώστε τα ωάρια να μη «φύγουν» πριν την ωοληψία.'],
  ['scans','Υπερηχογραφήματα και εξετάσεις αίματος','Κάθε 2 με 3 ημέρες ο γιατρός μετρά τα ωοθυλάκια και συχνά την οιστραδιόλη. Με βάση αυτά μπορεί να αλλάξει τη δόση. Είναι απολύτως φυσιολογικό.'],
  ['trigger','Ένεση ωρίμανσης (trigger)','Όταν αρκετά θυλάκια φτάσουν περίπου τα 17 έως 20 mm, γίνεται η ένεση ωρίμανσης σε συγκεκριμένη ώρα. Η ώρα είναι πολύ σημαντική: κάν\' την ακριβώς όπως σου είπαν.'],
  ['opu','Ωοληψία','Γίνεται συνήθως 34 έως 36 ώρες μετά το trigger, με μέθη. Διαρκεί λίγα λεπτά. Χρειάζεσαι νηστεία και συνοδό για την επιστροφή.'],
  ['lab','Γονιμοποίηση και καλλιέργεια','Στο εργαστήριο τα ωάρια γονιμοποιούνται (IVF ή ICSI). Ο εμβρυολόγος θα σε ενημερώνει για την εξέλιξη τις επόμενες 3 έως 6 ημέρες.'],
  ['transfer','Εμβρυομεταφορά ή κατάψυξη','Το έμβρυο μεταφέρεται στη μήτρα με λεπτό καθετήρα, χωρίς αναισθησία, ή τα έμβρυα καταψύχονται για μεταφορά σε επόμενο κύκλο.'],
  ['beta','Τεστ εγκυμοσύνης (β-hCG)','Εξέταση αίματος συνήθως 9 έως 11 ημέρες μετά από μεταφορά βλαστοκύστης. Μέχρι τότε συνεχίζεις την προγεστερόνη όπως σου έχουν πει.']]},
 long:{name:'Μακρύ πρωτόκολλο αγωνιστή',short:'Μακρύ',kind:'stim',steps:[
  ['down','Καταστολή (down-regulation)','Συνήθως από την 21η ημέρα του προηγούμενου κύκλου ξεκινά ο αγωνιστής, που «ξεκουράζει» τις ωοθήκες για περίπου 2 εβδομάδες. Μπορεί να έρθει περίοδος σε αυτό το διάστημα.'],
  ['start','Έναρξη διέγερσης','Μετά από υπερηχογράφημα και εξέταση αίματος που επιβεβαιώνουν την καταστολή, ξεκινούν οι γοναδοτροπίνες. Ο αγωνιστής συνήθως συνεχίζεται μέχρι το trigger.'],
  ['scans','Υπερηχογραφήματα και εξετάσεις αίματος','Παρακολούθηση κάθε 2 με 3 ημέρες για το μέγεθος των θυλακίων και την προσαρμογή της δόσης.'],
  ['trigger','Ένεση ωρίμανσης (trigger)','Γίνεται σε ακριβή ώρα όταν τα θυλάκια είναι έτοιμα.'],

  ['lab','Γονιμοποίηση και καλλιέργεια','Ενημέρωση από το εργαστήριο για τα έμβρυα.'],
  ['transfer','Εμβρυομεταφορά ή κατάψυξη','Μεταφορά ή κατάψυξη των εμβρύων.'],
  ['beta','Τεστ εγκυμοσύνης (β-hCG)','Εξέταση αίματος στην ημερομηνία που θα ορίσει η κλινική.']]},
 mild:{name:'Ήπια διέγερση ή φυσικός κύκλος',short:'Ήπια',kind:'stim',steps:[
  ['start','Έναρξη','Χαμηλότερες δόσεις φαρμάκων ή και καθόλου, με στόχο λίγα αλλά καλής ποιότητας ωάρια.'],
  ['scans','Παρακολούθηση','Υπερηχογραφήματα για να φανεί πότε το θυλάκιο (ή τα θυλάκια) είναι έτοιμα.'],
  ['trigger','Ένεση ωρίμανσης','Σε ακριβή ώρα, όπως σου ορίσουν.'],

  ['beta','Τεστ εγκυμοσύνης','Εξέταση αίματος στην ημερομηνία της κλινικής.']]},
 fet_nat:{name:'Μεταφορά κατεψυγμένου εμβρύου σε φυσικό κύκλο',short:'FET φυσικός',kind:'fet',steps:[
  ['start','1η ημέρα περιόδου','Ξεκινά ο κύκλος. Συνήθως δεν χρειάζονται φάρμακα για την ανάπτυξη του ενδομητρίου.'],

 fet_hrt:{name:'Μεταφορά κατεψυγμένου εμβρύου με ορμονική προετοιμασία',short:'FET ορμονικός',kind:'fet',steps:[
  ['start','Έναρξη οιστραδιόλης','Από τις πρώτες ημέρες της περιόδου ξεκινά οιστραδιόλη (χάπια, επιθέματα ή τζελ) για να παχύνει το ενδομήτριο.'],
  ['scans','Έλεγχος ενδομητρίου','Μετά από περίπου 10 έως 14 ημέρες, υπερηχογράφημα για το πάχος του ενδομητρίου (συνήθως στόχος από 7 mm και πάνω).'],
  ['luteal','Έναρξη προγεστερόνης','Όταν το ενδομήτριο είναι έτοιμο ξεκινά η προγεστερόνη. Η ημέρα έναρξης καθορίζει την ημέρα της μεταφοράς, γι\' αυτό η ακρίβεια μετράει.'],
  ['transfer','Απόψυξη και εμβρυομεταφορά','Για βλαστοκύστη, συνήθως την 6η ημέρα προγεστερόνης.'],
  ['beta','Τεστ εγκυμοσύνης','Εξέταση αίματος. Μη σταματήσεις οιστραδιόλη ή προγεστερόνη χωρίς οδηγία της κλινικής.']]}

const REDFLAGS=[['sevpain','Έντονος κοιλιακός πόνος'],['sevbloat','Φούσκωμα που αυξάνεται γρήγορα'],['breath','Δύσπνοια'],['urine','Λιγότερα ούρα από το συνηθισμένο'],['vomit','Επίμονοι έμετοι'],['fever','Πυρετός πάνω από 38°C'],['bleed','Έντονη αιμορραγία'],['leg','Πόνος ή πρήξιμο σε μία γάμπα'],['faint','Ζάλη ή λιποθυμία']];
const MOODS=['😣','😟','😐','🙂','😊'];
const AFFIRM=['Κάνεις ό,τι περνάει από το χέρι σου. Αυτό αρκεί.','Το άγχος δεν «χαλάει» τον κύκλο. Δεν φταις εσύ για ό,τι νιώθεις.','Ένα βήμα τη φορά. Σήμερα χρειάζεται μόνο το σημερινό.','Μπορείς να ζητήσεις βοήθεια. Δεν χρειάζεται να τα σηκώνεις όλα μόνη.','Η αξία σου δεν μετριέται με ένα αποτέλεσμα.','Επίτρεψε στον εαυτό σου να ξεκουραστεί χωρίς ενοχές.','Ό,τι κι αν νιώθεις σήμερα, είναι κατανοητό.'];

/* ---------- Icons ---------- */
const I={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',

 period:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/></svg>',

};

/* ---------- Cycle logic ---------- */
function phase(){
  const c=S.cycle,t=today(),now=new Date();
  if(!c.protocol||!c.start) return {key:'none',title:'Ξεκίνα ρυθμίζοντας τον κύκλο σου',text:'Συμπλήρωσε πρωτόκολλο και ημερομηνίες για να δεις σε ποιο σημείο βρίσκεσαι.'};
  if(c.beta&&t>=c.beta) return {key:'beta',title:'Ημέρα τεστ',text:t===c.beta?'Σήμερα είναι η ημέρα της β-hCG. Ό,τι κι αν δείξει, δεν είσαι μόνη.':'Η εξέταση έχει γίνει. Ακολούθησε τις οδηγίες της κλινικής για τα επόμενα βήματα.'};
  if(c.transfer&&t>=c.transfer){const d=days(c.transfer,t);return {key:'tww',title:'Αναμονή μετά τη μεταφορά',big:d,bigLabel:d===0?'ημέρα μεταφοράς':(d===1?'ημέρα μετά τη μεταφορά':'ημέρες μετά τη μεταφορά'),text:c.beta?('Τεστ σε '+days(t,c.beta)+' ημέρες ('+fmt(c.beta)+').'):'Ρώτα την κλινική πότε να κάνεις β-hCG.'}}
  if(c.opu&&t>=c.opu) return {key:'lab',title:t===c.opu?'Ημέρα ωοληψίας':'Τα έμβρυα στο εργαστήριο',text:c.transfer?('Μεταφορά: '+fmtL(c.transfer)+'.'):'Ο εμβρυολόγος θα σε ενημερώνει για την εξέλιξη.'};
  if(c.trigger&&now>=new Date(c.trigger)) return {key:'post',title:'Το trigger έγινε!',text:c.opu?('Ωοληψία: '+fmtL(c.opu)+'. Θυμήσου νηστεία και συνοδό.'):'Η ωοληψία γίνεται συνήθως 34 έως 36 ώρες μετά.'};
  if(t>=c.start){const d=days(c.start,t)+1;const fet=PROTOCOLS[c.protocol].kind==='fet';return {key:'stim',title:fet?'Προετοιμασία μήτρας':'Διέγερση ωοθηκών',big:d,bigLabel:fet?'ημέρα κύκλου':'ημέρα θεραπείας',text:c.trigger?('Trigger: '+fmtDT(c.trigger)):(fet?'Επόμενο βήμα: έλεγχος ενδομητρίου.':'Επόμενο βήμα: υπερηχογράφημα παρακολούθησης.')}}
  const d=days(t,c.start);return {key:'pre',title:'Λίγο πριν την έναρξη',big:d,bigLabel:d===1?'ημέρα για την έναρξη':'ημέρες για την έναρξη',text:'Ετοίμασε τα φάρμακα και διάβασε τον οδηγό ενέσεων.'};
}
function stepState(key){
  const c=S.cycle,t=today(),now=new Date();
  const done={start:c.start&&t>=c.start,down:c.start&&t>=c.start,antag:c.trigger&&now>=new Date(c.trigger),scans:(c.trigger&&now>=new Date(c.trigger))||(c.transfer&&t>=c.transfer),luteal:c.transfer&&t>=c.transfer,
    trigger:c.trigger&&now>=new Date(c.trigger),opu:c.opu&&t>c.opu,lab:c.transfer&&t>=c.transfer,transfer:c.transfer&&t>c.transfer,beta:c.beta&&t>c.beta};
  return done[key]?'past':'';
}

/* ---------- Meds ---------- */
function activeMeds(d){return S.meds.filter(m=>(!m.start||m.start<=d)&&(!m.end||m.end>=d))}
function doses(d){const out=[];activeMeds(d).forEach(m=>(m.times||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(tm=>out.push({m,tm,k:m.id+'@'+tm})));if(!out.length)activeMeds(d).forEach(m=>out.push({m,tm:'',k:m.id+'@'}));return out.sort((a,b)=>a.tm.localeCompare(b.tm))}
const TYPE={inj:'💉 Ένεση',pill:'💊 Χάπι',vag:'🌸 Κολπικό',patch:'🩹 Επίθεμα / τζελ',supp:'🌿 Συμπλήρωμα',other:'• Άλλο'};

/* ---------- Render helpers ---------- */
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function nav(){
  const r=route().split('/')[0];
  const moreSet=['more','scans','learn','questions','clinic','settings','inject','report','diary','period','preg','care','files','lifestyle','wellbeing','psybook','after','negative','baby','privacy','terms','embryo','partner'];
  const PGA=S.preg&&S.preg.active,sw=a=>a.map(x=>x[0]==='period'&&PGA?['preg','Εγκυμοσύνη']:x);
  $('#tabbar').innerHTML=sw(TABS).map(([k,l])=>`<a href="#${k}" class="${(k===r||(k==='more'&&moreSet.includes(r)&&!(k===r)&&!((PGA&&r==='preg')||(!PGA&&r==='period'))))?'on':''}">${I[k]}<span>${l}</span></a>`).join('');
  $('#deskNav').innerHTML=sw(DESK).map(([k,l])=>`<a href="#${k}" class="${k===r?'on':''}">${l}</a>`).join('');
}
const route=()=>location.hash.slice(1)||'today';

/* ---------- Views ---------- */
const V={};
V.today=()=>{
  const p=phase(),t=today(),ds=doses(t),tk=S.taken[t]||{},doneN=ds.filter(x=>tk[x.k]).length;
  const log=S.logs[t];const nextAppt=(S.cycle.appointments||[]).filter(a=>a.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  const aff=AFFIRM[parse(t).getDate()%AFFIRM.length];
  const trig=S.cycle.trigger&&new Date(S.cycle.trigger)>new Date()&&(new Date(S.cycle.trigger)-new Date())<3*864e5;
  return `
  <div class="grid g2">
   <div class="card hero">
     <div class="row between"><span class="pill">${S.cycle.protocol?PROTOCOLS[S.cycle.protocol].short:'Ο κύκλος σου'}</span><span class="small muted">${fmtL(t)}</span></div>
     <h1 style="margin-top:14px">${S.profile.name?'Γεια σου, '+esc(S.profile.name)+'!':'Γεια σου!'}</h1>
     ${p.big!=null?`<div class="row" style="margin:8px 0"><span class="big">${p.big}</span><span>${p.bigLabel}</span></div>`:''}
     <h2 style="margin-top:6px">${p.title}</h2><p>${p.text}</p>
     <div class="row"><a class="btn alt sm" href="#cycle">${p.key==='none'?'Ρύθμιση κύκλου':'Δες τον κύκλο'}</a>${p.key==='beta'?'<a class="btn alt sm" href="#preg">💜 Θετικό</a><a class="btn alt sm" href="#negative">🤍 Αρνητικό</a>':''}</div>
   </div>
   <div class="card">
     <div class="row between"><h2>Τα σημερινά φάρμακα</h2><span class="pill ${doneN===ds.length&&ds.length?'':'coral'}">${doneN}/${ds.length}</span></div>
     ${ds.length?ds.map(x=>doseRow(x,t,tk)).join(''):`<p class="muted">Δεν έχεις προσθέσει φάρμακα για σήμερα.</p><a class="btn sm" href="#meds">Πρόσθεσε φάρμακο</a>`}
   </div>
  </div>
  ${unread()?`<a class="card inbnote" href="#care"><b>🩺 ${unread()} ${unread()===1?'νέο':'νέα'} από τον γιατρό σου</b><span class="small">Πάτα για να τα δεις και να τα προσθέσεις στην εφαρμογή</span></a>`:''}
  ${['lab','post','tww'].includes(p.key)||labCur()?`<a class="card inbnote" href="#embryo" style="background:var(--lilac-soft)"><b>🧬 Τα έμβρυά μου</b><span class="small">${labCur()&&labCur().eggs?labCur().eggs+' ωάρια'+(labCur().blast?' · '+labCur().blast+' βλαστοκύστες':''):'Κατέγραψε τα νέα του εργαστηρίου και δες τι σημαίνουν'}</span></a>`:''}
  ${S.partnerOf?`<a class="card inbnote" href="#partner" style="background:var(--lilac-soft)"><b>👫 Μαζί με ${esc(S.partnerOf.name||'τη σύντροφό σου')}</b><span class="small">Δες τη φάση, τα ραντεβού και στείλε ένα μήνυμα</span></a>`:''}
  ${S.baby&&S.baby.born?`<a class="card inbnote" href="#baby" style="background:var(--coral-soft)"><b>👶 ${esc(S.baby.name||'Το μωρό μου')}</b><span class="small">Θηλασμός, πάνες, διάθεση, εμβόλια</span></a>`:''}
  ${trig?`<div class="alert info" style="margin-top:16px"><b>⏰ Trigger: ${fmtDT(S.cycle.trigger)}</b><br>Βάλε ξυπνητήρι στο κινητό. Η ακριβής ώρα είναι σημαντική για την ωοληψία. <a href="#" data-a="ics">Πρόσθεσέ το στο ημερολόγιο</a></div>`:''}
  <div class="grid g3" style="margin-top:16px">
   ${S.preg&&S.preg.active?pregMini():periodMini()}
   <div class="card"><h3>Πώς νιώθεις σήμερα;</h3>${log?`<p style="font-size:1.8rem;margin:4px 0">${log.mood?MOODS[log.mood-1]:'📝'}</p><p class="small muted">${(log.symptoms||[]).length} συμπτώματα καταγράφηκαν</p>`:'<p class="muted small">Μία καταγραφή την ημέρα βοηθά εσένα και τον γιατρό σου.</p>'}<a class="btn sm" href="#diary">${log?'Επεξεργασία':'Καταγραφή'}</a></div>
   <div class="card"><h3>Επόμενο ραντεβού</h3>${nextAppt?`<p><b>${fmtL(nextAppt.date)}${nextAppt.time?', '+nextAppt.time:''}</b><br>${esc(nextAppt.title)}</p>`:'<p class="muted small">Δεν υπάρχει προγραμματισμένο ραντεβού.</p>'}<a class="btn alt sm" href="#cycle">Ραντεβού</a></div>
   <div class="card coachMini"><span class="pill lilac">💞 Fertility Psy Coach</span><h3 style="margin-top:8px">${(PHASE_COACH[p.key]||PHASE_COACH.none).t}</h3><p class="small">${aff}</p><p class="small" style="margin:0">Για εσένα: <a href="#coach">${EX[(PHASE_COACH[p.key]||PHASE_COACH.none).me[0]].t}</a><br>Για το ζευγάρι: <a href="#coach">${EX[(PHASE_COACH[p.key]||PHASE_COACH.none).co[0]].t}</a></p><a class="btn sm" style="margin-top:10px;background:var(--lilac)" href="#coach">Άνοιξε το Psy Coach</a></div>
  </div>
  <div class="sectionTitle"><h2>Γρήγορη πρόσβαση</h2></div>
  <div class="tiles">
   ${tile('inject','💉','var(--coral-soft)','Οδηγός ενέσεων','Βήμα βήμα')}
   ${tile('scans','🔍','var(--teal-soft)','Υπερηχογραφήματα','Θυλάκια, ενδομήτριο')}
   ${tile('learn','📖','var(--lilac-soft)','Μάθε','Βήματα, λεξικό, μύθοι')}
   ${tile('clinic','📞','var(--gold-soft)','Κλινική','Τηλέφωνα, πότε καλώ')}
  </div>
  <div class="card soft" style="margin-top:16px"><div class="row between"><span><b>📧 Στείλε τις καταγραφές σου</b><br><span class="small muted">Στον γυναικολόγο ή στον ψυχολόγο σου, με ένα πάτημα.</span></span><a class="btn sm" href="#report">Αποστολή</a></div></div>`;
};
const tile=(h,ic,bg,t,s)=>`<a class="tile" href="#${h}"><span class="ic" style="background:${bg}">${ic}</span><b>${t}</b><span class="small muted">${s}</span></a>`;
const doseRow=(x,d,tk)=>`<div class="check ${tk[x.k]?'done':''}" data-a="take" data-k="${x.k}" data-d="${d}"><span class="box"></span><span class="t">${x.tm||'·'}</span><span><b>${esc(x.m.name)}</b><br><span class="small muted">${esc(x.m.dose||'')} ${TYPE[x.m.type]?'· '+TYPE[x.m.type]:''}</span></span></div>`;

V.cycle=()=>{
  const c=S.cycle,p=PROTOCOLS[c.protocol];const ph=phase();
  const opts=Object.entries(PROTOCOLS).map(([k,v])=>`<option value="${k}" ${k===c.protocol?'selected':''}>${v.name}</option>`).join('');
  const isStim=!p||p.kind==='stim';
  let suggestion='';
  if(c.trigger&&!c.opu){const d=new Date(new Date(c.trigger).getTime()+35*36e5);suggestion=`<p class="small muted">Ενδεικτικά, 35 ώρες μετά το trigger είναι ${fmtDT(d.toISOString())}. Την ακριβή ώρα την ορίζει η κλινική.</p>`}
  const appts=(c.appointments||[]).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  return `
  <h1>Ο κύκλος μου</h1>
  <div class="grid g2">
   <div class="card">
     <h2>Πρωτόκολλο και ημερομηνίες</h2>
     <p class="small muted">Συμπλήρωσε ό,τι ξέρεις. Τα υπόλοιπα τα προσθέτεις όταν σου τα πει η κλινική.</p>
     <form data-form="cycle">
      <label>Πρωτόκολλο</label><select name="protocol"><option value="">Επίλεξε…</option>${opts}</select>
      <div class="fields two">
       <div><label>${isStim?'Έναρξη θεραπείας':'1η ημέρα περιόδου / έναρξη'}</label><input type="date" name="start" value="${c.start}"></div>
       ${isStim?`<div><label>Ένεση ωρίμανσης (trigger)</label><input type="datetime-local" name="trigger" value="${c.trigger}"></div>
       <div><label>Ωοληψία</label><input type="date" name="opu" value="${c.opu}"></div>`:''}
       <div><label>Εμβρυομεταφορά</label><input type="date" name="transfer" value="${c.transfer}"></div>
       <div><label>Ηλικία εμβρύου</label><select name="stage">${[['3','3ης ημέρας'],['5','Βλαστοκύστη (5ης/6ης)']].map(([v,l])=>`<option value="${v}" ${c.stage===v?'selected':''}>${l}</option>`).join('')}</select></div>
       <div><label>Τεστ β-hCG</label><input type="date" name="beta" value="${c.beta}"></div>
      </div>
      ${suggestion}
      <div class="row" style="margin-top:14px"><button class="btn">Αποθήκευση</button><button type="button" class="btn alt" data-a="ics">📅 Στο ημερολόγιο του κινητού</button></div>
     </form>
   </div>
   <div class="card">
     <div class="row between"><h2>Τα βήματα</h2>${p?`<span class="pill lilac">${p.short}</span>`:''}</div>
     ${p?`<ul class="timeline">${p.steps.map(([k,t,d])=>{const st=stepState(k);return `<li class="${st}"><span class="dot"></span><h3>${t}</h3><p class="small">${d}</p></li>`}).join('')}</ul>`:'<p class="muted">Επίλεξε πρωτόκολλο για να δεις τα βήματα του κύκλου σου, εξηγημένα απλά.</p>'}
   </div>
  </div>
  <div class="card" style="margin-top:16px">
   <h2>Ραντεβού</h2>
   <form data-form="appt" class="fields two">
    <div><label>Τι</label><input name="title" placeholder="π.χ. Υπερηχογράφημα, αιμοληψία" required></div>
    <div class="fields two"><div><label>Ημερομηνία</label><input type="date" name="date" required></div><div><label>Ώρα</label><input type="time" name="time"></div></div>
    <div><button class="btn sm">Προσθήκη</button></div>
   </form>
   <div class="list" style="margin-top:12px">${appts.length?appts.map(a=>`<div class="item"><span><b>${fmtL(a.date)}${a.time?', '+a.time:''}</b><br>${esc(a.title)}</span><button class="btn ghost" data-a="delappt" data-id="${a.id}">✕</button></div>`).join(''):'<p class="muted small">Κανένα ραντεβού ακόμη.</p>'}</div>
  </div>`;
};

V.meds=()=>{
  const t=today(),ds=doses(t),tk=S.taken[t]||{};
  const hist=[...Array(7)].map((_,i)=>addDays(t,-6+i)).map(d=>{const a=doses(d),k=S.taken[d]||{},n=a.filter(x=>k[x.k]).length;return {d,n,t:a.length}});
  return `
  <h1>Φάρμακα</h1>
  <div class="grid g2">
   <div class="card">
    <h2>Σήμερα</h2>
    ${ds.length?ds.map(x=>doseRow(x,t,tk)).join(''):'<p class="muted">Δεν υπάρχουν δόσεις για σήμερα.</p>'}
    <div class="row" style="margin-top:12px"><button class="btn alt sm" data-a="notif">🔔 Ειδοποιήσεις</button><button class="btn alt sm" data-a="ics">📅 Υπενθυμίσεις στο ημερολόγιο</button></div>
    <p class="small muted">Οι ειδοποιήσεις του browser λειτουργούν όσο η εφαρμογή είναι ανοιχτή. Για σίγουρες υπενθυμίσεις, πρόσθεσε τα φάρμακα στο ημερολόγιο του κινητού σου (με ξυπνητήρι σε κάθε δόση).</p>
    <h3 style="margin-top:14px">Τελευταίες 7 ημέρες</h3>
    <div class="row">${hist.map(h=>`<div style="text-align:center;flex:1"><div style="height:46px;display:flex;align-items:flex-end;justify-content:center"><div style="width:18px;border-radius:6px;background:${h.t&&h.n===h.t?'var(--teal)':'var(--coral)'};height:${h.t?Math.max(6,46*h.n/h.t):4}px;opacity:${h.t?1:.25}"></div></div><span class="small muted">${parse(h.d).getDate()}</span></div>`).join('')}</div>
   </div>
   <div class="card">
    <h2>Πρόσθεσε φάρμακο ή συμπλήρωμα</h2>
    <div class="chips" style="margin-bottom:6px">${SUPP.map(s=>`<button type="button" class="chip" data-a="suppre" data-v="${s}">🌿 ${s}</button>`).join('')}</div>
    <form data-form="med">
     <label>Όνομα</label><input name="name" placeholder="Όπως είναι γραμμένο στο κουτί" required>
     <div class="fields two">
      <div><label>Δόση</label><input name="dose" placeholder="π.χ. 150 IU, 1 δισκίο"></div>
      <div><label>Μορφή</label><select name="type">${Object.entries(TYPE).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div><label>Ώρες (χωρισμένες με κόμμα)</label><input name="times" placeholder="20:00 ή 08:00, 20:00"></div>
      <div><label>Από</label><input type="date" name="start" value="${t}"></div>
      <div><label>Έως (αν ξέρεις)</label><input type="date" name="end"></div>
      <div><label>Σημείωση</label><input name="notes" placeholder="π.χ. στο ψυγείο"></div>
     </div>
     <button class="btn" style="margin-top:12px">Προσθήκη</button>
    </form>
   </div>
  </div>
  ${S.meds.some(m=>m.type==='inj')||(S.inj||[]).length?`<div style="margin-top:16px">${injCard()}</div>`:''}
  <div class="sectionTitle"><h2>Η λίστα μου</h2><a href="#inject">Οδηγός ενέσεων →</a></div>
  <div class="list">${S.meds.length?S.meds.map(m=>`<div class="item"><span><b>${esc(m.name)}</b> <span class="small muted">${esc(m.dose)}</span><br><span class="small">${TYPE[m.type]||''} · ${esc(m.times||'χωρίς ώρα')} · ${m.start?fmt(m.start):''}${m.end?' έως '+fmt(m.end):''}</span>${m.notes?`<br><span class="small muted">${esc(m.notes)}</span>`:''}</span><button class="btn ghost" data-a="delmed" data-id="${m.id}">✕</button></div>`).join(''):'<p class="muted">Η λίστα είναι άδεια. Πρόσθεσε τα φάρμακα όπως σου τα έγραψε η κλινική.</p>'}</div>
  <div class="alert info" style="margin-top:16px">Ξέχασες μια δόση; Μην διπλασιάσεις την επόμενη. Κάλεσε την κλινική για οδηγίες.</div>`;
};

V.inject=()=>`<div style="margin-bottom:16px">${injCard()}</div>
  <a href="#meds" class="btn ghost">← Φάρμακα</a>
  <h1>Οδηγός υποδόριας ένεσης</h1>
  <p class="muted">Γενικά βήματα. Ακολούθησε πάντα το φύλλο οδηγιών του φαρμάκου σου και ό,τι σου έδειξε η νοσηλεύτρια.</p>
  <div class="grid g2">
   <div class="card"><ul class="timeline">${[
    ['Προετοιμασία','Πλύνε καλά τα χέρια. Έλεγξε όνομα, δόση και ημερομηνία λήξης. Βγάλε το φάρμακο από το ψυγείο λίγα λεπτά νωρίτερα αν έτσι λέει το φύλλο οδηγιών.'],
    ['Επιλογή σημείου','Συνήθως στην κοιλιά, περίπου 5 cm γύρω από τον αφαλό, ή στον μηρό. Άλλαζε σημείο κάθε φορά (δεξιά, αριστερά).'],
    ['Καθαρισμός','Καθάρισε με οινόπνευμα και άφησε να στεγνώσει. Έτσι τσούζει λιγότερο.'],
    ['Πένα ή σύριγγα','Στην πένα βάλε καινούργια βελόνα και ρύθμισε τη δόση. Στη σύριγγα διάλυσε το φάρμακο όπως σου έδειξαν και διώξε τις φυσαλίδες.'],
    ['Ένεση','Πιάσε απαλά μια πτυχή δέρματος, βάλε τη βελόνα κάθετα, πίεσε αργά μέχρι τέλους. Μέτρα ως το 10 πριν τη βγάλεις.'],
    ['Μετά','Πίεσε ελαφρά με βαμβάκι, χωρίς τρίψιμο. Πέτα τη βελόνα σε δοχείο αιχμηρών. Σημείωσε τη δόση στην εφαρμογή.']
   ].map(([t,d],i)=>`<li class="past"><span class="dot"></span><h3>${i+1}. ${t}</h3><p class="small">${d}</p></li>`).join('')}</ul></div>
   <div class="grid">
    <div class="card soft"><h3>Είναι φυσιολογικό</h3><p class="small">Λίγη κοκκινίλα, μικρός μώλωπας ή φαγούρα στο σημείο για λίγες ώρες.</p></div>
    <div class="card soft"><h3>Χρήσιμα tips</h3><p class="small">Πάγος για λίγα δευτερόλεπτα πριν μειώνει τον πόνο. Κάνε τις ενέσεις την ίδια ώρα κάθε μέρα. Βάλε ξυπνητήρι. Αν φοβάσαι, ζήτησε από τον σύντροφο να μάθει κι αυτός.</p></div>
    <div class="alert"><b>Κάλεσε την κλινική αν:</b> έκανες λάθος δόση, ξέχασες δόση, ή το σημείο είναι πολύ πρησμένο, ζεστό και πονάει.</div>
   </div>
  </div>`;

V.diary=()=>{
  const d=(route().split('/')[1])||today();const L=S.logs[d]||{symptoms:[],flags:[],mood:0,weight:'',notes:''};
  const prev=S.logs[addDays(d,-1)];const wJump=prev&&prev.weight&&L.weight&&(parseFloat(L.weight)-parseFloat(prev.weight))>=1;
  const flagged=(L.flags||[]).length||wJump;
  const recent=Object.keys(S.logs).sort().reverse().slice(0,10);
  return `
  <h1>Ημερολόγιο</h1>
  <div class="grid g2">
   <div class="card">
    <div class="row between"><h2>${fmtL(d)}</h2><input type="date" value="${d}" style="width:auto" data-a="diarydate"></div>
    ${flagged?`<div class="alert" style="margin:10px 0"><b>Επικοινώνησε σήμερα με την κλινική.</b><br>${wJump?'Αύξηση βάρους 1 κιλό ή περισσότερο σε μία ημέρα. ':''}Κάποια από όσα σημείωσες χρειάζονται εκτίμηση από γιατρό (π.χ. για σύνδρομο υπερδιέγερσης ωοθηκών). ${S.clinic.phone?`<a class="btn danger sm" style="margin-top:8px" href="tel:${esc(S.clinic.phone)}">📞 Κλήση κλινικής</a>`:''}<br><span class="small">Σε έντονη δύσπνοια ή λιποθυμία κάλεσε 166 ή 112.</span></div>`:''}
    <label>Διάθεση</label><div class="moods">${MOODS.map((m,i)=>`<button type="button" class="${L.mood===i+1?'on':''}" data-a="mood" data-v="${i+1}" data-d="${d}">${m}</button>`).join('')}</div>
    <label>Συχνά και συνήθως αθώα</label><div class="chips">${SYMPTOMS.map(([k,l])=>`<button type="button" class="chip ${(L.symptoms||[]).includes(k)?'on':''}" data-a="sym" data-k="${k}" data-d="${d}">${l}</button>`).join('')}</div>
    <label>Χρειάζονται άμεση επικοινωνία με την κλινική</label><div class="chips">${REDFLAGS.map(([k,l])=>`<button type="button" class="chip flag ${(L.flags||[]).includes(k)?'on':''}" data-a="flag" data-k="${k}" data-d="${d}">${l}</button>`).join('')}</div>
    <form data-form="log" data-d="${d}">
     <div class="fields two"><div><label>Βάρος (kg)</label><input name="weight" inputmode="decimal" value="${esc(L.weight)}" placeholder="π.χ. 62.4"></div></div>
     <label>Σημειώσεις</label><textarea name="notes" placeholder="Ό,τι θέλεις να θυμάσαι ή να πεις στον γιατρό">${esc(L.notes)}</textarea>
     <button class="btn" style="margin-top:10px">Αποθήκευση</button>
    </form>
   </div>

function chart(rows,key,label,color,unit){
  const pts=rows.filter(r=>r[key]!=null&&!isNaN(r[key]));if(pts.length<2)return '';
  const W=600,H=200,P=34;const max=Math.max(...pts.map(p=>p[key]))*1.15||1;
  const x=i=>P+(W-2*P)*i/(pts.length-1),y=v=>H-P-(H-2*P)*v/max;
  const path=pts.map((p,i)=>(i?'L':'M')+x(i)+','+y(p[key])).join(' ');
  return `<h3>${label}</h3><svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#ece3dc"/><path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[key])}" r="5" fill="${color}"/><text x="${x(i)}" y="${y(p[key])-10}" text-anchor="middle" font-size="12" fill="#2b2a33">${p[key]}${unit}</text><text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6f6b75">${fmt(p.date).split(' ')[0]}/${parse(p.date).getMonth()+1}</text>`).join('')}</svg>`;
}
const sizes=s=>(s||'').split(/[,\s]+/).map(Number).filter(n=>n>0);

     <button class="btn" style="margin-top:12px">Αποθήκευση</button>
    </form>
   </div>
   <div class="card">${rows.length>=2?chart(rows,'max','Μεγαλύτερο θυλάκιο','#e9775a',' mm')+chart(rows,'endoN','Ενδομήτριο','#2f7f7a',' mm'):'<h3>Η πρόοδός σου</h3><p class="muted">Μετά από δύο καταγραφές θα εμφανιστεί γράφημα.</p>'}
    <details><summary>Τι σημαίνουν αυτά τα νούμερα;</summary><div class="inner small"><p>Τα <b>ωοθυλάκια</b> είναι μικρές «φούσκες» με υγρό· μέσα σε καθένα μπορεί (όχι πάντα) να υπάρχει ωάριο. Μεγαλώνουν περίπου 1 με 2 mm την ημέρα κατά τη διέγερση.</p><p>Το trigger γίνεται συνήθως όταν αρκετά φτάσουν περίπου τα 17 έως 20 mm. Ο αριθμός των θυλακίων δεν είναι ίδιος με τον αριθμό των ωαρίων.</p><p>Το <b>ενδομήτριο</b> είναι το εσωτερικό τοίχωμα της μήτρας. Συνήθως στόχος είναι από 7 mm και πάνω.</p><p>Κάθε σώμα ανταποκρίνεται διαφορετικά. Η σύγκριση με άλλες γυναίκες συχνά προσθέτει άγχος χωρίς λόγο.</p></div></details>

const COACH_TABS=[['','Αρχική'],['me','Για εσένα'],['couple','Για το ζευγάρι'],['checkin','Check-in ζευγαριού'],['guide','Οδηγός συναισθημάτων']];

function exCard(id,open){
  const e=EX[id];if(!e)return '';const n=(S.coach.done[id]||[]).length;
  return `<details class="ex" ${open?'open':''} id="ex-${id}"><summary><span><span class="pill ${e.who==='me'?'coral':'lilac'}">${e.who==='me'?'Για εσένα':'Για το ζευγάρι'}</span> <span class="small muted">· ${e.m}′</span><br>${e.t}${exDone(id)?' ✓':''}</span></summary><div class="inner">
   <p class="small muted">${e.why}</p>
   ${e.steps?`<ol class="small">${e.steps.map(s=>`<li style="margin:4px 0">${s}</li>`).join('')}</ol>`:''}
   ${e.breath?`<div style="text-align:center"><div class="breath" id="breath">Έτοιμη;</div><div class="row" style="justify-content:center"><button class="btn" data-a="breath">Ξεκίνα (3 λεπτά)</button><button class="btn alt" data-a="breathstop">Στοπ</button></div></div>`:''}
   ${e.record?recordForm():''}
   ${e.timer?`<div class="row" style="margin:8px 0"><button class="btn alt sm" data-a="timer" data-m="${e.timer}">⏱ Χρονόμετρο ${e.timer}′</button><span class="small" id="timer-${id}"></span></div>`:''}
   ${e.q?`<form data-form="reflect" data-id="${id}"><label>${e.q}</label><textarea name="text">${esc((S.coach.notes[id]||''))}</textarea><button class="btn alt sm" style="margin-top:8px">Αποθήκευση σημείωσης</button></form>`:''}
   <div class="row between" style="margin-top:12px"><button class="btn sm ${exDone(id)?'alt':''}" data-a="exdone" data-id="${id}">${exDone(id)?'✓ Έγινε σήμερα':'Το κάναμε σήμερα'}</button><span class="small muted">${n?'Ολοκληρώθηκε '+n+(n===1?' φορά':' φορές'):''}</span></div>
  </div></details>`;
}
function recordForm(){return `<form data-form="record"><div class="fields two">

  <div><label>Πιο ισορροπημένη σκέψη</label><input name="alt" placeholder="π.χ. Συχνά καλούν αργά το απόγευμα"></div>
  <div><label>Πώς νιώθω τώρα; (0 έως 100)</label><input name="after" placeholder="π.χ. Άγχος 50"></div></div>
  <button class="btn sm" style="margin-top:10px">Αποθήκευση</button></form>

function stressAdvice(v){
  if(v==null)return '';
  if(v<=3)return '<p>Καλή μέρα για να φροντίσεις τη σχέση σας: δοκίμαστε τα «Τρία πράγματα που εκτιμώ σε σένα».</p>';
  if(v<=6)return '<p>Μέτρια ένταση. Κάνε την <a href="#coach/me">Αναπνοή 4 · 6</a> και τον «χρόνο ανησυχίας». Πες στον σύντροφό σου πώς είσαι.</p>';
  if(v<=8)return '<p>Υψηλή ένταση. Μην τη σηκώνεις μόνη: μίλα με τον σύντροφο ή μια φίλη σήμερα, κάνε το «Διάλειμμα αυτοσυμπόνιας» και σκέψου μια συνεδρία με ψυχολόγο.</p>';
  return '<p><b>Πολύ υψηλή ένταση.</b> Αξίζεις στήριξη τώρα. Μίλησε σήμερα με ψυχολόγο και με κάποιον κοντινό σου άνθρωπο. Σε έκτακτη ανάγκη κάλεσε <a href="tel:166">166</a> ή <a href="tel:112">112</a>.</p>';
}

/* ---------- ICS ---------- */
function ics(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Baby OClock//EL','CALSCALE:GREGORIAN'];
  const dt=(d,t)=>d.replace(/-/g,'')+'T'+(t||'09:00').replace(':','')+'00';
  const ev=(title,d,t,extra=[],alarms=['-PT0M'])=>{L.push('BEGIN:VEVENT','UID:'+uid()+'@babyoclock','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+dt(d,t),'DURATION:PT15M','SUMMARY:'+title.replace(/[,;]/g,' '),...extra);alarms.forEach(a=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title.replace(/[,;]/g,' '),'TRIGGER:'+a,'END:VALARM'));L.push('END:VEVENT')};
  S.meds.forEach(m=>(m.times||'09:00').split(',').map(x=>x.trim()).filter(Boolean).forEach(tm=>ev('💊 '+m.name+(m.dose?' '+m.dose:''),m.start||today(),tm,['RRULE:FREQ=DAILY'+(m.end?';UNTIL='+m.end.replace(/-/g,'')+'T235959':';COUNT=14')])));
  const c=S.cycle;
  if(c.trigger){const d=new Date(c.trigger);ev('⏰ Ένεση ωρίμανσης (trigger)',ymd(d),pad(d.getHours())+':'+pad(d.getMinutes()),[],['-PT60M','-PT10M','-PT0M'])}
  if(c.opu)ev('Ωοληψία',c.opu,'08:00',[],['-P1D']);
  if(c.transfer)ev('Εμβρυομεταφορά',c.transfer,'09:00',[],['-P1D']);
  if(c.beta)ev('Τεστ β-hCG',c.beta,'08:00',[],['-P1D']);
  (c.appointments||[]).forEach(a=>ev(a.title,a.date,a.time||'09:00',[],['-PT60M']));
  L.push('END:VCALENDAR');
  if(L.length<6){toast('Πρόσθεσε πρώτα φάρμακα ή ημερομηνίες');return}
  download(new Blob([L.join('\r\n')],{type:'text/calendar'}),'baby-oclock.ics');toast('Άνοιξε το αρχείο για προσθήκη στο ημερολόγιο');
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

async function notify(title,body){try{if(!('Notification' in window)||Notification.permission!=='granted')return;const r=await navigator.serviceWorker?.getRegistration();if(r)await r.showNotification(title,{body,icon:'icon.svg',tag:title});else new Notification(title,{body})}catch(e){}}
function tick(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const t=today(),now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());const tk=S.taken[t]||{};
  doses(t).forEach(x=>{const id=t+x.k;if(x.tm&&x.tm<=hm&&!tk[x.k]&&!S.notified[id]){S.notified[id]=1;save();notify('Ώρα για: '+x.m.name,(x.m.dose||'')+' · '+x.tm)}});
  if(S.cycle.trigger){const d=new Date(S.cycle.trigger),m=(d-now)/6e4,id='trig'+S.cycle.trigger;if(m<=30&&m>-5&&!S.notified[id]){S.notified[id]=1;save();notify('⏰ Trigger σε λίγο',fmtDT(S.cycle.trigger))}}
}

const IDB={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('babyoclock',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
 async get(id){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction('files').objectStore('files').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}},
 async put(o){const db=await this.open();return new Promise(res=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(o);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)})},
 async del(id){const db=await this.open();return new Promise(res=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>res(true)})}};
const FCAT=[['blood','🩸 Αιματολογικές'],['us','🔍 Υπερηχογράφημα'],['semen','🧬 Σπερμοδιάγραμμα'],['report','📄 Γνωμάτευση'],['rx','💊 Συνταγή'],['other','📎 Άλλο']];

async function compressFile(f){
  if(f.type==='application/pdf'){if(f.size>700000)throw new Error('big');return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
  const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const M=1600,sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let q=.75,d=c.toDataURL('image/jpeg',q);while(d.length>900000&&q>.35){q-=.15;d=c.toDataURL('image/jpeg',q)}return d;
}
async function fileUp(meta,data){if(!USER||!DB)return false;try{await DB.collection('users').doc(USER.uid).collection('files').doc(meta.id).set({...meta,data});return true}catch(e){return false}}
async function fileData(id){let o=await IDB.get(id);if(o)return o.data;if(USER&&DB){try{const s=await DB.collection('users').doc(USER.uid).collection('files').doc(id).get();if(s.exists){await IDB.put({id,data:s.data().data});return s.data().data}}catch(e){}}return null}
async function filesSync(){if(!USER||!DB)return;for(const f of (S.files||[]).filter(f=>!f.synced)){const o=await IDB.get(f.id);if(o&&await fileUp(f,o.data)){f.synced=true}}save()}

const LOCKK='bo-lock';let lockedAt=0,hiddenAt=0;
const lockCfg=()=>{try{return JSON.parse(localStorage.getItem(LOCKK)||'null')}catch(e){return null}};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function bioAvailable(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function bioRegister(){
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Baby O’Clock'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'babyoclock',displayName:'Baby O’Clock'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  return b64(cred.rawId);
}
async function bioVerify(id){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(id)}],userVerification:'required',timeout:60000}});return true}catch(e){return false}}
function showLock(){
  const c=lockCfg();if(!c||document.getElementById('lock'))return;
  const m=document.createElement('div');m.id='lock';let pin='';
  const draw=()=>{m.innerHTML=`<div class="lockin"><img src="icon.svg" width="64" alt=""><h2>Baby O’Clock</h2><p class="small">Βάλε το PIN σου</p><div class="dots">${[...Array(c.len)].map((_,i)=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9,'bio',0,'del'].map(k=>k==='bio'?(c.bio?`<button data-k="bio">🔐</button>`:'<span></span>'):k==='del'?'<button data-k="del">⌫</button>':`<button data-k="${k}">${k}</button>`).join('')}</div>
   <button class="btn ghost" data-k="forgot" style="color:#fff">Ξέχασα το PIN</button></div>`};
  draw();document.body.appendChild(m);
  m.addEventListener('click',async e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(k==null)return;
    if(k==='del'){pin=pin.slice(0,-1);draw();return}
    if(k==='bio'){if(await bioVerify(c.bio)){m.remove()}return}
    if(k==='forgot'){if(confirm('Για ασφάλεια, θα διαγραφούν τα δεδομένα από αυτή τη συσκευή και το PIN. Αν είσαι συνδεδεμένη με Google, θα τα ξαναβρείς όταν συνδεθείς. Συνέχεια;')){localStorage.removeItem(KEY);localStorage.removeItem(LOCKK);location.reload()}return}
    if(pin.length<c.len){pin+=k;draw();if(pin.length===c.len){if(await sha(c.salt+pin)===c.hash){m.remove()}else{m.querySelector('.dots').classList.add('shake');setTimeout(()=>{pin='';draw()},450)}}}});
  if(c.bio)setTimeout(async()=>{if(document.getElementById('lock')&&await bioVerify(c.bio))document.getElementById('lock')?.remove()},300);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>120000)showLock()});

V.partner=()=>{
